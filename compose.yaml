version: '3'
services:
  db:
    image: gonesharathchandragone/dockerjava:dbimage
    ports:
      - "3306:3306"
    deploy:
      replicas: 1
  app:
    image: gonesharathchandragone/dockerjava:appimage
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:mysql://db:3306/institute?useSSL=false&allowPublicKeyRetrieval=true"
      DB_USER: appuser
      DB_PASSWORD: apppass
    deploy:
      replicas: 2